<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex flex-col items-center mt-20 ">
        <h1 class="font-medium text-2xl ">Leafboard</h1>
        <h1>Work without Limits</h1>
    </div>

    <div class="flex flex-col mx-10 mt-10 ww-full">
    <form action="" class="flex flex-col">
        <label for="" class="font-medium ">Your email address</label>
        <input type="text" name="" id="" placeholder="yourmail@mail.com" class="border-none ring rounded-full pl-2 mt-2 py-2 ring-slate-200 ring-1">

        <label for="" class="font-medium mt-4 ">Your password</label>
        <input type="text" name="" id="" placeholder="min. 8 characters" class="border-none ring rounded-full pl-2 mt-2 py-2 ring-slate-200 ring-1">

        <button class="mt-8  bg-gray-100 rounded-full py-2 font-medium text-gray-200 focus:bg-[#A4FE82]">Continue</button>
    </form>
    <h1 class="items-center text-lg my-4 mx-auto font-medium">or</h1>
    <div class="flex flex-col gap-2">
        <button class=" rounded-full py-2 font-medium text-gray-600 ring ring-slate-200 ring-1 ">Sign up with Google</button>
        <button class=" rounded-full py-2 font-medium text-gray-600 ring ring-slate-200">Sign up with Apple</button>
</div>

</div>


  </body>
</html>
