<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="mx-2 mt-8">
    <!-- header -->
     <div class="flex justify-between bg-transparent">
        <h1 class="font-bold text-2xl italic">SCULP</h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5" />
        </svg>
        
     </div>

     <!-- hero -->
      <div class="flex flex-col bg-[#c2ece4] p-4 rounded-md mt-8 gap-4 pb-12 relative">
        <h1 class="text-6xl font-medium">Build Your Ideal Body</h1>
        <p class="text-md">Best workout tools created by leading fitness and sports experts fit for every purpose and experience</p>

        <div class="flex gap-4 ">
          <button class="rounded-full border-none ring px-4 py-2 w-1/2">Download App</button>
          <button class="rounded-full border-none px-4 py-2 bg-black text-white w-1/2 ">Get started</button>
        </div>
      </div>
      <div class=" -mt-4 z-10 mr-0 flex justify-end ">
        <div class="bg-white -mt-2 z-100 mr-0 flex justify-end z-10 h-10 rounded-l-full ">
           <div class="invisible w-42 -mt-8">h</div>
          </div>
        </div>

        <!-- video section -->
         <div class="flex flex-col mt-8 gap-4 items-center">
          <h1 class="font-medium text-3xl">Exercise Video Library</h1>
          <p class="text-center">Our comprehensive videos and instructions show you how to perform exercises using correct technique for the best result.</p>

          <div class="relative animate-pulse">
            <button class="rounded-full border-none ring ring-1 px-10 py-2 w-3/4 font-medium w-full ">View Exercises</button>
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 absolute -mt-8 ml-2 ">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
            </svg>
        </div>
          
         </div>
  </body>
</html>
