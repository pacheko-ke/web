<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="mx-4 md:mx-10 mt-4">
    <div class="flex justify-between">
        <div class="flex flex-col">
            <h1 class="text-2xl text-blue-500">Zoho.</h1>
            <p>A better way to manage your worspace in one place.</p>
            <p>Create a better experience with Zoho Desktop</p>
        </div>

        <div class="flex justify-end">
            <h1 class="text-sm">English (USA)</h1>
        </div>
    </div>

    <!-- body -->
     <div class="flex flex-col mx-auto md:flex-row gap-4 mt-1 md:mt-6 justify-between">
        <img src="" alt="illustration of a man" class="invisible md:visible">
        <div class="flex flex-col justify-end">
            <h1 class="uppercase text-sm text-gray-400">Start for free</h1>
            <h1 class="text-2xl font-medium">Sign Up To Zoho.</h1>

            <h1 class="text-sm text-gray-400">Already a member? <span class="text-blue-500">Log In</span> </h1>
            <h1 class="mt-4">E-mail</h1>
            
            <input type="email" name="" id="" placeholder="name@mail.com" class=" text-sm border rounded-md px-2 py-2 ">
            <h1 class="mt-4">Password</h1>

            <!-- mail -->
             <div class="relative w-full">
                <input type="email" name="" id="" placeholder="6+ characters,1 capital letter" class="text-sm border rounded-md px-2 py-2 w-full">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="absolute size-6 text-gray-400 -mt-8 ml- ">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm0 0c0 1.657 1.007 3 2.25 3S21 13.657 21 12a9 9 0 1 0-2.636 6.364M16.5 12V8.25" />
                </svg>
            </div>
              
           
            <!-- button -->
             <button class="rounded-md py-2 mt-4 bg-blue-500 text-white">
                Create an account
             </button>

             <div class="flex relative text-center items-center space-x-2">
             <button class="rounded-md py-2 mt-4 px-10 bg-transparent border border-1 text-sm text-slate-400 w-full mx-auto">
                Sign up with Google
             </button>
             <svg class="text-sm text-blue-500 dark:text-white absolute mt-4 ml-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="" viewBox="0 0 24 24" >
                <path fill-rule="evenodds" d="M12.037 21.998a10.313 10.313 0 0 1-7.168-3.049 9.888 9.888 0 0 1-2.868-7.118 9.947 9.947 0 0 1 3.064-6.949A10.37 10.37 0 0 1 12.212 2h.176a9.935 9.935 0 0 1 6.614 2.564L16.457 6.88a6.187 6.187 0 0 0-4.131-1.566 6.9 6.9 0 0 0-4.794 1.913 6.618 6.618 0 0 0-2.045 4.657 6.608 6.608 0 0 0 1.882 4.723 6.891 6.891 0 0 0 4.725 2.07h.143c1.41.072 2.8-.354 3.917-1.2a5.77 5.77 0 0 0 2.172-3.41l.043-.117H12.22v-3.41h9.678c.075.617.109 1.238.1 1.859-.099 5.741-4.017 9.6-9.746 9.6l-.215-.002Z" clip-rule="evensodd"/>
              </svg>
            </div>
              


             <!-- terms -->
              <div class="policy text-sm mt-10">
                <h1 class="text-slate-400">This site is protected by recaptacha from Google</h1>
                <h1 class=" text-slate-400"> <span class="text-blue-500">Privacy Policy</span> and <span class="text-blue-500">Terms of use</span> apply </h1>
            </div>
        </div>
     </div>
  </body>
</html>
